<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Orçamento - Editora Brancaleone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF7F2;
            color: #1C1917;
            padding: 20px;
        }
        .simulator-card {
            max-width: 680px;
            margin: 0 auto;
            background: #FFFFFF;
            border: 2px solid #C5A059;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #5B1424;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header span {
            color: #C5A059;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header h2 {
            color: #5B1424;
            font-size: 24px;
            margin: 6px 0;
        }
        .header p {
            font-size: 13px;
            color: #666;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #5B1424;
            font-size: 14px;
            margin-bottom: 6px;
        }
        select, input[type="number"], input[type="text"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #CCC;
            border-radius: 6px;
            font-size: 14px;
            background-color: #FFF;
        }
        .help-text {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
            display: block;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 480px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        .price-box {
            background-color: #5B1424;
            color: #FFFFFF;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0 15px 0;
        }
        .price-box span {
            color: #C5A059;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .price-total {
            font-size: 32px;
            font-weight: bold;
            margin: 6px 0;
            color: #FFFFFF;
        }
        .price-unit {
            font-size: 13px;
            color: #E5C887;
        }
        .btn-whatsapp {
            width: 100%;
            background-color: #25D366;
            color: #FFFFFF;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1EBE5D;
        }
    </style>
</head>
<body>

<div class="simulator-card">
    <div class="header">
        <span>EDITORA BRANCALEONE</span>
        <h2>Simulador de Orçamento</h2>
        <p>Calcule a estimativa de publicação da sua obra em tempo real.</p>
    </div>

    <div class="form-group">
        <label>1. Formato do Livro</label>
        <select id="formato" onchange="calcular()">
            <option value="14x21" selected>14 × 21 cm (Padrão: Romances, Contos, Poesias)</option>
            <option value="16x23">16 × 23 cm (Nobre: Biografias, Não-Ficção, Ensaios)</option>
            <option value="17x24">17 × 24 cm (Ampliado: Livros Acadêmicos, Técnicos)</option>
        </select>
    </div>

    <div class="form-group">
        <label>2. Papel do Miolo</label>
        <select id="papel" onchange="calcular()">
            <option value="polen" selected>Pólen Soft 80g (Amarelado - Conforto de leitura)</option>
            <option value="offset">Offset Branco 75g (Tradicional - Branco)</option>
            <option value="couche">Couché 115g (Especial - Fotos e Ilustrações)</option>
        </select>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>3. Número de Páginas</label>
            <input type="number" id="paginas" value="160" min="32" max="1000" oninput="calcular()">
            <span class="help-text">1 pág Word (A4) ≈ 1.5 a 2 págs de livro.</span>
        </div>
        <div class="form-group">
            <label>4. Tiragem (Exemplares)</label>
            <input type="number" id="tiragem" value="100" min="30" max="5000" oninput="calcular()">
        </div>
    </div>

    <div class="price-box">
        <span>Estimativa do Projeto</span>
        <div class="price-total" id="res-total">R$ 0,00</div>
        <div class="price-unit" id="res-unitario">Custo por exemplar: R$ 0,00</div>
    </div>

    <div class="form-group">
        <label>Enviar para Análise Editorial</label>
        <input type="text" id="nome" placeholder="Seu Nome Completo" style="margin-bottom: 8px;">
        <input type="text" id="titulo" placeholder="Título da Obra (ou Provisório)">
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Solicitar Orçamento via WhatsApp ➔</button>
    </div>
</div>

<script>
function calcular() {
    var formato = document.getElementById('formato').value;
    var papel = document.getElementById('papel').value;
    var paginas = parseInt(document.getElementById('paginas').value) || 32;
    var tiragem = parseInt(document.getElementById('tiragem').value) || 30;

    if (paginas < 32) paginas = 32;
    if (tiragem < 30) tiragem = 30;

    var custoPagina = 0.08;
    if (formato === '16x23') custoPagina = 0.10;
    if (formato === '17x24') custoPagina = 0.12;

    var multPapel = 1.0;
    if (papel === 'offset') multPapel = 0.9;
    if (papel === 'couche') multPapel = 1.35;

    var custoFixo = 750;
    var custoGrafico = (paginas * custoPagina * multPapel);
    var total = custoFixo + (custoGrafico * tiragem);
    var unitario = total / tiragem;

    document.getElementById('res-total').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('res-unitario').innerText = 'Custo por exemplar: ' + unitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function enviarWhatsApp() {
    var nome = document.getElementById('nome').value.trim();
    var titulo = document.getElementById('titulo').value.trim();

    if (!nome || !titulo) {
        alert('Por favor, preencha seu nome e o título da obra.');
        return;
    }

    var formatoText = document.getElementById('formato').options[document.getElementById('formato').selectedIndex].text;
    var papelText = document.getElementById('papel').options[document.getElementById('papel').selectedIndex].text;
    var paginas = document.getElementById('paginas').value;
    var tiragem = document.getElementById('tiragem').value;
    var total = document.getElementById('res-total').innerText;

    var msg = "Olá! Meu nome é " + nome + ". Fiz uma simulação para o livro '" + titulo + "':\n\n" +
              "- Formato: " + formatoText + "\n" +
              "- Papel: " + papelText + "\n" +
              "- Páginas: " + paginas + "\n" +
              "- Tiragem: " + tiragem + " exemplares\n" +
              "- Estimativa: " + total + "\n\nGostaria de enviar o manuscrito para avaliação.";

    window.open("https://wa.me/5598991448505?text=" + encodeURIComponent(msg), '_blank');
}

calcular();
</script>

</body>
</html>
