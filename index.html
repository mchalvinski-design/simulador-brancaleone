<script>
function calcular() {
    var formato = document.getElementById('formato').value;
    var papel = document.getElementById('papel').value;
    var paginas = parseInt(document.getElementById('paginas').value) || 32;
    var tiragem = parseInt(document.getElementById('tiragem').value) || 30;

    if (paginas < 32) paginas = 32;
    if (tiragem < 30) tiragem = 30;

    // Custo por página (miolo P&B conforme formato)
    var custoPagina = 0.10; // Formato 14x21
    if (formato === '16x23') custoPagina = 0.12;
    if (formato === '17x24') custoPagina = 0.14;

    // Fator do papel do miolo
    var multPapel = 1.0; // Pólen Soft 80g
    if (papel === 'offset') multPapel = 0.95;
    if (papel === 'couche') multPapel = 1.40;

    // Custo fixo de produção editorial (inclui capa com orelha 8cm, ISBN e setup)
    var custoFixo = 1800; 

    // Cálculo final
    var custoGrafico = (paginas * custoPagina * multPapel);
    var total = custoFixo + (custoGrafico * tiragem);
    var unitario = total / tiragem;

    document.getElementById('res-total').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('res-unitario').innerText = 'Custo por exemplar: ' + unitario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function enviarWhatsApp() {
    var nome = document.getElementById('nome').value.trim();
    var titulo = document.getElementById('titulo').value.trim();

    if (!nome || !titulo) {
        alert('Por favor, preencha seu nome e o título da obra.');
        return;
    }

    var formatoText = document.getElementById('formato').options[document.getElementById('formato').selectedIndex].text;
    var papelText = document.getElementById('papel').options[document.getElementById('papel').selectedIndex].text;
    var paginas = document.getElementById('paginas').value;
    var tiragem = document.getElementById('tiragem').value;
    var total = document.getElementById('res-total').innerText;

    var msg = "Olá! Meu nome é " + nome + ". Fiz uma simulação para o livro '" + titulo + "':\n\n" +
              "- Formato: " + formatoText + "\n" +
              "- Papel: " + papelText + "\n" +
              "- Páginas: " + paginas + "\n" +
              "- Tiragem: " + tiragem + " exemplares\n" +
              "- Estimativa: " + total + "\n\nGostaria de enviar o manuscrito para avaliação.";

    window.open("https://wa.me/5598991448505?text=" + encodeURIComponent(msg), '_blank');
}

calcular();
</script>
