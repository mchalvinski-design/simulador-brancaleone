<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simule uma estimativa inicial para publicação do seu livro com a Editora Brancaleone.">
  <title>Simulador de Orçamento - Editora Brancaleone</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Libre Baskerville", Georgia, "Times New Roman", serif;
      background-color: #FFFFFF; color: #111111; padding: 20px;
    }
    .simulator-card {
      max-width: 680px; margin: 0 auto; background: #FFFFFF;
      border: 2px solid #650000; border-radius: 12px; padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .brand-logo {
      display: block; width: min(100%, 360px); height: auto;
      margin: 0 auto 16px; object-fit: contain;
    }
    .header { text-align: center; border-bottom: 2px solid #650000; padding-bottom: 15px; margin-bottom: 20px; }
    .header span { color: #650000; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .header h1 { color: #650000; font-size: 24px; margin: 6px 0; }
    .header p { font-size: 13px; color: #333333; line-height: 1.5; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: bold; color: #650000; font-size: 14px; margin-bottom: 6px; }
    select, input[type="number"], input[type="text"] {
      width: 100%; padding: 11px; border: 1px solid #888888; border-radius: 6px;
      font-size: 14px; background-color: #FFF; color: #111111;
    }
    input:focus, select:focus, button:focus-visible { outline: 3px solid rgba(101,0,0,.35); outline-offset: 2px; }
    input[aria-invalid="true"] { border-color: #B42318; }
    .help-text { font-size: 11px; color: #444444; margin-top: 4px; display: block; line-height: 1.45; }
    .error-text { color: #B42318; font-size: 12px; margin-top: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .price-box { background-color: #650000; color: #FFFFFF; padding: 20px; border-radius: 8px; text-align: center; margin: 20px 0 15px; }
    .price-box span { color: #FFFFFF; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .price-total { font-size: 32px; font-weight: bold; margin: 6px 0; color: #FFFFFF; }
    .price-unit { font-size: 13px; color: #FFFFFF; }
    .cost-breakdown { font-size: 12px; color: #F8EEDB; margin-top: 10px; line-height: 1.6; }
    .notice { background: #FFF8E8; border-left: 4px solid #C5A059; color: #650000; padding: 12px; border-radius: 4px; font-size: 12px; line-height: 1.55; margin: 14px 0; }
    .btn-whatsapp { width: 100%; background-color: #25D366; color: #FFFFFF; font-weight: bold; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
    .btn-whatsapp:hover { background-color: #1EBE5D; }
    .btn-whatsapp:disabled { opacity: .55; cursor: not-allowed; }
    
    /* Linha divisória e Botão Voltar ao Início */
    .divider {
      border: 0;
      border-top: 1px solid #650000;
      margin: 20px 0 15px 0;
      opacity: 0.3;
    }
    .btn-voltar-inicio {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #7A1414; /* Vermelho Brancaleone */
      color: #FFFFFF;
      font-weight: bold;
      padding: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: background-color 0.2s ease-in-out;
    }
    .btn-voltar-inicio:hover {
      background-color: #5c0f0f;
      color: #FFFFFF;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .simulator-card { padding: 18px; }
      .grid-2 { grid-template-columns: 1fr; gap: 0; }
      .price-total { font-size: 28px; }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>

  </main>
